<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/favicon-192.png') }}">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin Dashboard{% endblock %}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/brand-bootstrap.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-utils.css') }}">

  {% block head %}{% endblock %}
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
    <script src="{{ url_for('static', filename='js/admin/admin-csrf.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-toast.css') }}">
    <script src="{{ url_for('static', filename='js/admin/admin-toast.js') }}"></script>
</head>
<body class="ah-body">
    {% include 'admin/_flash.html' %}

  {% block body %}{% endblock %}

  <script src="{{ url_for('static', filename='js/admin/admin.js') }}"></script>
</body>
</html>
