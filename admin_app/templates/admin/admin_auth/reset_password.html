{% extends 'admin/admin_auth/base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin_auth/reset_password.css') }}">
<h3 class="text-center">Set New Password</h3>
<p class="text-center auth-note">Choose a strong password (at least 8 characters, including a letter and a number).</p>

<form action="{{ url_for('admin.admin_reset_password', token=token) }}" method="POST">
    <div class="form-group position-relative">
        <input type="password" id="password" name="password" class="form-control" placeholder=" " required minlength="8">
        <label for="password" class="form-label">New Password*</label>
        <span class="toggle-password" onclick="togglePassword('password', this)"
              role="button" tabindex="0" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>
    <div class="form-group position-relative">
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder=" " required minlength="8">
        <label for="confirm_password" class="form-label">Confirm Password*</label>
        <span class="toggle-password" onclick="togglePassword('confirm_password', this)"
              role="button" tabindex="0" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Reset Password</button>
</form>

<div class="text-center mt-2">
    <a href="{{ url_for('admin.admin_login') }}">Back to Login</a>
</div>

<script src="{{ url_for('static', filename='js/admin/admin_auth/password_toggle.js') }}"></script>
{% endblock %}
