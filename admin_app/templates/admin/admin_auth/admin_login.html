{% extends 'admin/admin_auth/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
{% if step == 'email' %}
<h3>Sign in to continue</h3>
<form action="{{ url_for('admin.admin_login') }}" method="POST" autocomplete="on">
    <div class="form-group">
        <input type="email" id="email" name="email" class="form-control" placeholder=" " autocomplete="username email" required autofocus>
        <label for="email" class="form-label">Email address</label>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Continue</button>
</form>

<div class="text-center mt-2">
    <a href="{{ url_for('admin.admin_forgot_password') }}">Forgot password?</a>
</div>

{% elif step == 'password' %}
<h3>Enter your password</h3>
<form action="{{ url_for('admin.admin_login') }}" method="POST" autocomplete="on">
    <div class="form-group position-relative">
        <input type="password" id="password" name="password" class="form-control" placeholder=" " autocomplete="current-password" required autofocus>
        <label for="password" class="form-label">Password</label>
        <span id="toggle-password" class="toggle-password" onclick="togglePassword()"
              role="button" tabindex="0" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Sign In</button>
</form>

<div class="text-center mt-2">
    <a href="{{ url_for('admin.admin_login', go_back=1) }}" id="go-back-link">Go Back</a>
    <span class="auth-sep">|</span>
    <a href="{{ url_for('admin.admin_forgot_password') }}">Forgot password?</a>
</div>
{% endif %}

<script src="{{ url_for('static', filename='js/admin/admin_auth/password_toggle.js') }}"></script>
{% endblock %}
