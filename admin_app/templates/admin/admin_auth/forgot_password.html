{% extends 'admin/admin_auth/base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<h3 class="text-center">Reset Password</h3>
<p class="text-center auth-note">Enter your admin email and we'll send you a secure reset link.</p>

<form action="{{ url_for('admin.admin_forgot_password') }}" method="POST">
    <div class="form-group">
        <input type="email" id="email" name="email" class="form-control" placeholder=" " required>
        <label for="email" class="form-label">Email*</label>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Send Reset Link</button>
</form>

<div class="text-center mt-2">
    <a href="{{ url_for('admin.admin_login') }}">Back to Login</a>
</div>
{% endblock %}
