<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/favicon-192.png') }}">
    <meta charset="UTF-8">
    <title>{% block title %}Admin{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/manage_course/enroll_course.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-utils.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-shell.css') }}">
    {% block styles %}{% endblock %}
    {% block scripts %}{% endblock %}
    <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
    <script src="{{ url_for('static', filename='js/admin/admin-csrf.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-toast.css') }}">
    <script src="{{ url_for('static', filename='js/admin/admin-toast.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-confirm.css') }}">
    <script src="{{ url_for('static', filename='js/admin/admin-confirm.js') }}"></script>
</head>
<body data-can-manage="{{ 1 if can_manage else 0 }}" data-login-url="{{ url_for('admin.admin_login') }}">
    {% include 'admin/_flash.html' %}
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/admin/manage_course/enroll_course.js') }}"></script>
</body>
</html>
