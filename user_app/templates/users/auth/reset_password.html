{% extends 'users/auth/base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/users/auth/reset_password.css') }}">

<h3 class="text-center">Set New Password</h3>
<p class="text-center" style="color:#992c25;font-size:.9rem;margin-bottom:1rem;">Choose a strong new password for your account.</p>

<form action="{{ url_for('users.user_reset_password', token=token) }}" method="POST">
    <div class="form-group position-relative">
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder=" " autocomplete="new-password" required minlength="8">
        <label for="new_password" class="form-label">New Password*</label>
        <span class="toggle-password" data-target="new_password"
              role="button" tabindex="0" aria-pressed="false" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>
    <div class="form-group position-relative">
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder=" " autocomplete="new-password" required minlength="8">
        <label for="confirm_password" class="form-label">Confirm Password*</label>
        <span class="toggle-password" data-target="confirm_password"
              role="button" tabindex="0" aria-pressed="false" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Reset Password</button>
    <div class="text-center mt-3">
        <a href="{{ url_for('users.user_login') }}">Back to login</a>
    </div>
</form>

<script src="{{ url_for('static', filename='js/users/auth/reset_password.js') }}"></script>
{% endblock %}
