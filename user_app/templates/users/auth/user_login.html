{% extends 'users/auth/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<h3 class="text-center">Login Account</h3>

{% if step == 'email' %}
<form action="{{ url_for('users.user_login') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <input type="email" id="email" name="email" class="form-control" placeholder=" " required>
        <label for="email" class="form-label">Email*</label>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Continue</button>
</form>

<div class="text-center mt-3">
    <a href="{{ url_for('users.user_forgot_password') }}" id="forgot-password-link">Forgot Password?</a>
</div>

{% elif step == 'password' %}
<form action="{{ url_for('users.user_login') }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <input type="password" id="password" name="password" class="form-control" placeholder=" " required>
        <label for="password" class="form-label">Password*</label>
        <span id="toggle-password" class="toggle-password"
              role="button" tabindex="0" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>
    <button type="submit" class="btn btn-primary btn-continue btn-block">Continue</button>
</form>

<div class="text-center mt-3">
    <a href="{{ url_for('users.user_forgot_password') }}" id="forgot-password-link">Forgot Password?</a>
</div>
<div class="text-center mt-2">
    <a href="{{ url_for('users.user_login', go_back=True) }}" id="go-back-link">Go Back</a>
</div>
{% endif %}

<div class="text-center mt-3">
    <a href="{{ url_for('users.user_signup', next=request.args.get('next', '')) }}" id="login-link">Don't have an account? Register</a>
</div>
<div class="text-center mt-4">
    <a href="{{ url_for('users.google_login', next=request.args.get('next', '')) }}" id="google-login-link" class="btn d-flex align-items-center justify-content-center">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google Logo">
        <span>Continue with Google</span>
    </a>
</div>

<script src="{{ url_for('static', filename='js/users/auth/user_login.js') }}"></script>
{% endblock %}
