{% extends 'users/auth/base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/users/auth/set_password.css') }}">

<h3 class="text-center">Reset Password</h3>

<form action="{{ url_for('users.user_set_password', email=email) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder=" " required>
        <label for="new_password" class="form-label">New Password*</label>
        <span id="toggle-password-new" class="toggle-password"
              role="button" tabindex="0" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>

        <div id="password-strength" class="password-strength mt-2 text-muted small">
            Password must contain at least:
            <ul>
                <li id="upper-check" style="color: red;">One uppercase letter</li>
                <li id="number-check" style="color: red;">One number</li>
                <li id="special-check" style="color: red;">One special character</li>
            </ul>
        </div>
    </div>

    <div class="form-group">
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder=" " required>
        <label for="confirm_password" class="form-label">Confirm Password*</label>
        <span id="toggle-password-confirm" class="toggle-password"
              role="button" tabindex="0" aria-label="Show password"><i class="fas fa-eye" aria-hidden="true"></i></span>
    </div>

    <button type="submit" class="btn btn-primary btn-continue btn-block">Submit Password</button>
    <div class="text-center mt-3">
        <a href="{{ url_for('users.user_login', next=request.args.get('next', '')) }}" id="go-back">Back to Login</a>
    </div>
</form>

<script src="{{ url_for('static', filename='js/users/auth/set_password.js') }}"></script>
{% endblock %}
