<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title|default('Error') }}</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center;
               justify-content: center; background: #f5f6f8; padding: 16px;
               font-family: 'Segoe UI', system-ui, sans-serif; }
        .err { max-width: 340px; text-align: center; }
        .err .code { font-size: 13px; font-weight: 600; color: #9ca3af; margin-bottom: 4px; }
        .err h1 { margin: 0 0 6px; font-size: 16px; font-weight: 700; color: #1f2937; }
        .err p { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: #6b7280; }
        .err a { display: inline-block; padding: 7px 16px; border-radius: 8px;
                 background: #992c25; color: #fff; font-size: 13px; font-weight: 600;
                 text-decoration: none; }
        .err a:hover { background: #7d2018; }
    </style>
</head>
<body>
    <div class="err">
        {% if error_code %}<div class="code">{{ error_code }}</div>{% endif %}
        <h1>{{ error_title|default('Oops!') }}</h1>
        <p>{{ error_message|default("Something went wrong. Please try again.") }}</p>
        <a href="{{ url_for('users.index') }}">Home</a>
    </div>
</body>
</html>
