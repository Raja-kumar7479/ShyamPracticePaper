<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assessment In Progress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body { background-color: #fafafa; font-family: 'Segoe UI', sans-serif; }
        .notice-card { background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 56px 40px; max-width: 560px; margin: 12vh auto; text-align: center; border-top: 5px solid #992c25; }
        .notice-icon { font-size: 3.2rem; color: #992c25; margin-bottom: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="notice-card">
            <i class="fas fa-window-restore notice-icon"></i>
            <h2 class="fw-bold mb-3">Your assessment is open in the secure exam window</h2>
            <p class="text-muted fs-5 mb-1">{{ test.subject_title }}</p>
            <p class="text-muted mb-4">Please continue there. Do not close that window until you submit.</p>
            <a href="{{ url_for('users.open_mock_test_section', section_id=section_id, course_code=course_code, unique_code=unique_code) }}" class="btn btn-outline-secondary px-4">
                <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
            </a>
        </div>
    </div>
</body>
</html>
