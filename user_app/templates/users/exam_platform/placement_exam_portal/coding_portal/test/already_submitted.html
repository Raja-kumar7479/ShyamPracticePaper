<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Already Submitted | {{ test.title }}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users/brand-bootstrap.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users/exam_platform/placement_exam_portal/round_assessments.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users/exam_platform/placement_exam_portal/coding_portal/already_submitted.css') }}">
</head>
<body>
    <main class="as-wrap">
        <section class="as-card" role="alert">
            <div class="as-icon"><i class="fas fa-circle-check"></i></div>

            <h1 class="as-title">Assessment already submitted</h1>
            <p class="as-sub">
                You have already completed <strong>{{ test.title }}</strong>.
                This assessment can be attempted only once, so it cannot be restarted.
            </p>

            <div class="as-actions">
                <a href="{{ result_url }}" class="as-btn as-btn--primary">
                    <i class="fas fa-chart-simple"></i> View my result
                </a>
                <a href="{{ dashboard_url }}" class="as-btn as-btn--ghost">
                    <i class="fas fa-arrow-left"></i> Back to assessments
                </a>
            </div>

            <p class="as-note">
                <i class="fas fa-circle-info"></i>
                If you believe this is a mistake, contact your administrator.
            </p>
        </section>
    </main>
</body>
</html>
