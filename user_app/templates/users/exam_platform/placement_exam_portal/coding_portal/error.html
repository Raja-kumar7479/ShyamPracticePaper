{% extends "users/exam_platform/placement_exam_portal/coding_portal/base.html" %}
{% block title %}{{ code }} | ShyamPracticePaper{% endblock %}

    <div style="font-size:44px;font-weight:700;color:var(--fg-faint)">{{ code }}</div>

  </div>
</div>
{% endblock %}
