<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/favicon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ round_name }} Round - Coming Soon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users/brand-bootstrap.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users/exam_platform/placement_exam_portal/round_coming_soon.css') }}">
</head>
<body>
    <div class="container">
        <div class="soon-card">
            {% if round_name == 'Aptitude' %}
                <i class="fas fa-brain soon-icon"></i>
            {% elif round_name == 'Coding' %}
                <i class="fas fa-laptop-code soon-icon"></i>
            {% else %}
                <i class="fas fa-hourglass-half soon-icon"></i>
            {% endif %}
            <h2 class="fw-bold mb-3">{{ round_name }} Round</h2>
            <p class="text-muted fs-5 mb-4">This assessment portal is under development and will be available soon. Stay tuned!</p>
            <a href="{{ url_for('users.view_course_dashboard', course_code=course_code, unique_code=unique_code) }}" class="btn btn-primary px-4">
                <i class="fas fa-arrow-left me-2"></i> Back to Course
            </a>
        </div>
    </div>
</body>
</html>
